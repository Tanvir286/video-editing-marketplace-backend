services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend
    container_name: backend
    ports:
      - '4000:4000'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:root@postgres/backend
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TURN_SERVER=turn:turnserver:3478
      - TURN_USERNAME=webrtc
      - TURN_PASSWORD=strongpassword
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres
      - redis
    command: yarn start:dev-swc

  postgres:
    image: postgres:latest
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: backend
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - '6380:6379'

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: always

  turnserver:
    image: coturn/coturn
    container_name: turnserver
    restart: always
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '5349:5349/tcp'
      - '49152-49160:49152-49160/udp'
    volumes:
      - ./dockerfiles/coturn/turnserver.conf:/etc/turnserver.conf
    environment:
      - TURN_USERNAME=webrtc
      - TURN_PASSWORD=strongpassword

volumes:
  postgres_data:
  prometheus_data:
